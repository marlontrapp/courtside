    PatchedBookingRuleRequest:
      type: object
      description: |-
        A club's booking rule, for club admins (read and write). Where it applies:
        linked `courts`, `day_templates` (slot configurations) and `slots` (single
        slots of day templates) — ids of this club's; nothing linked = the whole
        club; each kind of link narrows it. `valid_from` / `valid_until`: when
        it's in force. `kind` + `params`: see GET /api/v1/booking-rule-kinds/.
        Expects `context["club"]`.
      properties:
        name:
          type: string
          minLength: 1
          description: Shown to players, e.g. "Women's evening".
          maxLength: 100
        kind:
          type: string
          minLength: 1
          description: What the rule requires — see the booking rule kinds.
          maxLength: 50
        params: {}
        courts:
          type: array
          items:
            type: string
            format: uuid
        day_templates:
          type: array
          items:
            type: string
            format: uuid
        slots:
          type: array
          items:
            type: string
            format: uuid
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          nullable: true
          description: Last day the rule applies (inclusive).
        is_active:
          type: boolean
    PatchedClubUpdateRequest:
      type: object
      description: |-
        Input for editing a club: every setting except `name` and `address` —
        changing those goes through support instead, since the name anchors the
        slug and both may be referenced outside this API.
      properties:
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        access_type:
          allOf:
          - $ref: '#/components/schemas/AccessTypeEnum'
          description: |-
            Members-only clubs restrict court visibility and booking to members.

            * `OPEN` - Open to all players
            * `MEMBERS_ONLY` - Members only
        cancellation_window_hours:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: 'Cancellation policy: players can cancel a confirmed booking
            up to this many hours before it starts. 0 = until the start time.'
        is_active:
          type: boolean
