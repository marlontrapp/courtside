  /api/v1/clubs/search/:
    get:
      operationId: clubs_search_list
      description: |2

        **Active** clubs — open and members-only (`access_type` tells them apart) —
        whose **name or address** contains every word of `q`. The address is free
        text, so anything in it is searchable: street, number, neighbourhood, city,
        state, country. Names and addresses are returned exactly as entered
        (accents included).

        Best matches first: the name starts with the query, then the name contains it, then the name contains every word, then the rest; ties by name. Paginated **without a total count** (counting every match can cost as much as the search itself); a page past the end is empty.
      summary: Find clubs by name and address
      parameters:
      - name: page
        required: false
        in: query
        description: Page number (25 per page); a page past the end is empty.
        schema:
          type: integer
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
        description: 'Words to find in the club''s name or address: every word must
          appear, whole or partial, ignoring case and accents. Words are runs of letters/digits
          (punctuation separates them); 1-character words are ignored; at least one
          word needs 3+ characters (shorter ones still filter); at most 8 words and
          100 characters. Typos aren''t corrected. Examples: `ibira` (partial word),
          `sao paulo` / `SÃO PAULO`, `tennis portugal` (name + address), `av paulista,
          1000`.'
        required: true
      tags:
      - Clubs
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClubSearchResultList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: '`q` missing/blank, too long, too many words, or no word of
            3+ characters: `{"q": ["…"]}`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not logged in (or, for writes, no CSRF token).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: '`page` isn''t a positive integer.'
  /api/v1/courts/:
    get:
      operationId: courts_list
      description: |2

        Active courts the user may book — courts of **open** clubs plus **members-only**
        clubs where the user has an active membership — each with its free slots.

        Court filters and the availability window are AND-combined; comma-separated
        values are OR-ed. **Window:** no date/time params → **today**; `date` → all
        free slots that day; `date_from` + `date_to` → an inclusive range of at most
        7 days; `time_from` / `time_to` → only slots fully inside this time of day,
        each day. Dates/times are wall-clock in each club's timezone; past dates are
        rejected. When any date/time param is given, courts with **no** free slot in
        the window are omitted (e.g. a court taken by a tournament at that time);
        without them every matching court is listed, with today's slots.

        Each court lists:
        - `is_singles_only` — a singles court: no doubles, at most 2 players;
        - `available_slots` — its slots that haven't started and don't overlap an
          active booking; each slot's `rules` lists the ids of the booking rules
          covering it;
        - `notices` — one-time overrides in the window (`type`, `notes`): why a day
          differs from the usual schedule (e.g. no morning slots: a tournament);
        - `booking_rules` — the rules its slots are subject to (`name`, `summary`,
          e.g. "Women only"). Whether the user meets them is decided when booking.
      summary: List bookable courts with their available slots
      parameters:
      - in: query
        name: club
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Club ids.
        explode: false
        style: form
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: A single day (not with date_from/date_to).
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: First day of an inclusive range, with date_to (at most 7 days).
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Last day of the range (inclusive).
      - in: query
        name: is_indoor
        schema:
          type: boolean
        description: Indoor (true) or outdoor (false) courts.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: surface_type
        schema:
          type: array
          items:
            type: string
            enum:
            - CLAY
            - GRASS
            - HARD
            - SYNTHETIC
        description: |-
          Court surfaces.

          * `CLAY` - Clay
          * `HARD` - Hard
          * `GRASS` - Grass
          * `SYNTHETIC` - Synthetic
        explode: false
        style: form
      - in: query
        name: time_from
        schema:
          type: string
          format: time
        description: Only slots fully inside time_from–time_to (HH:MM, club time),
          each day.
      - in: query
        name: time_to
        schema:
          type: string
          format: time
        description: End of the time window (HH:MM; "24:00" = midnight).
      tags:
      - Courts
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourtAvailabilityList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Invalid input: `{"<field>": ["message", …]}` (or `non_field_errors`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not logged in (or, for writes, no CSRF token).
