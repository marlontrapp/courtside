    Reservation:
      type: object
      description: |-
        Output representation; times are ISO-8601 in the club's timezone.

        `status` is the stored status; `state` is the lifecycle bucket derived from
        status + time (what the `state` filter uses). `role` is relative to the
        requesting user: "owner" (booked it) or "guest". `can_cancel` says whether
        the requesting user may cancel it right now; `cancellation_deadline` is the
        club policy's cutoff for confirmed bookings.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        court:
          allOf:
          - $ref: '#/components/schemas/ReservedCourt'
          readOnly: true
        start:
          type: string
          format: date-time
          readOnly: true
        end:
          type: string
          format: date-time
          readOnly: true
        booking_type:
          $ref: '#/components/schemas/ReservationBookingTypeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        primary_player:
          allOf:
          - $ref: '#/components/schemas/PlayerSummary'
          readOnly: true
        includes_lighting:
          type: boolean
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        guests:
          type: array
          items:
            $ref: '#/components/schemas/PlayerSummary'
          readOnly: true
        notes:
          type: string
        can_cancel:
          type: boolean
          readOnly: true
        cancellation_deadline:
          type: string
          format: date-time
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancellation_reason:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - can_cancel
      - cancellation_deadline
      - court
      - created_at
      - end
      - guests
      - id
      - primary_player
      - role
      - start
      - state
