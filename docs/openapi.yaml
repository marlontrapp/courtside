          format: uuid
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
          description: Use "24:00" for a booking ending at midnight.
        booking_type:
          allOf:
          - $ref: '#/components/schemas/ReservationCreateBookingTypeEnum'
          default: SINGLES
        includes_lighting:
          type: boolean
          default: false
        guests:
          type: array
          items:
            type: string
            minLength: 1
          description: Registered players joining the booking, each given by email
            or by player id (the user id, as returned by the player search) — both
            can be mixed.
          maxItems: 3
        notes:
          type: string
          default: ''
          maxLength: 500
      required:
      - court
      - date
      - end_time
      - start_time
    ReservationSummary:
      type: object
      description: A booking a schedule change affects.
      properties:
        id:
          type: string
          format: uuid
        court:
          type: string
          format: uuid
        court_name:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        primary_player:
          $ref: '#/components/schemas/PlayerSummary'
        status:
          type: string
      required:
      - court
      - court_name
      - end
      - id
      - primary_player
      - start
      - status
    ReservedCourt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: e.g. "Court 1 - Guga"
          maxLength: 128
        surface_type:
          $ref: '#/components/schemas/SurfaceTypeEnum'
        is_indoor:
          type: boolean
        is_singles_only:
          type: boolean
          description: 'A singles court (e.g. too narrow for doubles): bookings can''t
            be doubles and take at most 2 players — the booker and 1 guest.'
        club:
          allOf:
          - $ref: '#/components/schemas/ClubSummary'
          readOnly: true
      required:
      - club
      - id
      - name
    RoleEnum:
      type: string
      enum:
      - owner
      - guest
    RuleRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
      - id
      - name
    ScheduleConflict:
      type: object
      properties:
        detail:
          type: string
        conflicting_reservations:
          type: array
          items:
            $ref: '#/components/schemas/ReservationSummary'
        hint:
          type: string
      required:
      - conflicting_reservations
      - detail
      - hint
    ScheduleDays:
      type: object
      properties:
        weekdays:
          type: array
          items:
            $ref: '#/components/schemas/WeekdaysEnum'
        day_template:
          allOf:
          - $ref: '#/components/schemas/TemplateRef'
          nullable: true
          description: null = closed those days.
      required:
      - day_template
      - weekdays
    ScheduleOverride:
      type: object
      properties:
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/TypeEnum'
        notes:
          type: string
          description: Shown to members, e.g. "Junior club championship until 14:00".
          maxLength: 500
        day_template:
          allOf:
          - $ref: '#/components/schemas/TemplateRef'
          nullable: true
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - day_template
      - slots
      - updated_at
    ScheduleOverrideChange:
      type: object
      properties:
        date:
          type: string
          format: date
        type:
          $ref: '#/components/schemas/TypeEnum'
        notes:
          type: string
          description: Shown to members, e.g. "Junior club championship until 14:00".
          maxLength: 500
        day_template:
          allOf:
          - $ref: '#/components/schemas/TemplateRef'
          nullable: true
        slots:
          type: array
          items:
            $ref: '#/components/schemas/Slot'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        cancelled_reservations:
          type: array
          items:
            $ref: '#/components/schemas/ReservationSummary'
      required:
      - cancelled_reservations
      - created_at
      - date
      - day_template
      - slots
      - updated_at
    ScheduleOverrideWriteRequest:
      type: object
      description: |-
        {"day_template": "<id>" | null (closed), "type": "TOURNAMENT",
         "notes": "Junior club championship until 14:00", "force": false}
      properties:
        day_template:
          type: string
          format: uuid
          nullable: true
          description: null = closed that day.
        type:
          $ref: '#/components/schemas/TypeEnum'
        notes:
          type: string
          default: ''
          description: Shown to members.
          maxLength: 500
        force:
          type: boolean
          default: false
      required:
      - day_template
      - type
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        last_name:
          type: string
          minLength: 1
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: 'Optional: without one, log in with codes sent by email.'
      required:
      - email
      - first_name
      - last_name
    SkillLevelEnum:
      enum:
      - '1.0'
      - '1.5'
      - '2.0'
      - '2.5'
      - '3.0'
      - '3.5'
      - '4.0'
      - '4.5'
      - '5.0'
      - '5.5'
      - '7.0'
      type: string
      description: |-
        * `1.0` - 1.0 – Beginner
        * `1.5` - 1.5
        * `2.0` - 2.0
        * `2.5` - 2.5
        * `3.0` - 3.0
        * `3.5` - 3.5
        * `4.0` - 4.0
        * `4.5` - 4.5
        * `5.0` - 5.0
        * `5.5` - 5.5
        * `7.0` - 7.0 – Tour / Pro
    Slot:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: The slot's id (e.g. to link a booking rule to it).
        start:
          type: string
          format: time
        end:
          type: string
          format: time
          description: Use "24:00" for a slot ending at midnight.
      required:
      - end
      - id
      - start
    SlotRequest:
      type: object
      properties:
        start:
          type: string
          format: time
        end:
          type: string
          format: time
          description: Use "24:00" for a slot ending at midnight.
      required:
      - end
      - start
    StateEnum:
      type: string
      enum:
      - upcoming
      - pending_payment
      - completed
      - cancelled
      - expired
    StatusEnum:
      enum:
      - PENDING_PAYMENT
      - CONFIRMED
      - CANCELLED
      - COMPLETED
      - EXPIRED
      type: string
      description: |-
        * `PENDING_PAYMENT` - Pending payment
        * `CONFIRMED` - Confirmed
        * `CANCELLED` - Cancelled
        * `COMPLETED` - Completed
        * `EXPIRED` - Expired
    SurfaceTypeEnum:
      enum:
      - CLAY
      - HARD
      - GRASS
      - SYNTHETIC
      type: string
      description: |-
        * `CLAY` - Clay
        * `HARD` - Hard
        * `GRASS` - Grass
        * `SYNTHETIC` - Synthetic
    TemplateRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    TimeSlot:
      type: object
      description: |-
        Slot boundaries as ISO-8601 in the club's own timezone (offset included),
        and the ids of the booking rules that cover it (see the court's `booking_rules`).
      properties:
        start:
          type: string
          format: date-time
          readOnly: true
        end:
          type: string
          format: date-time
          readOnly: true
        rules:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
      required:
      - end
      - rules
      - start
    TypeEnum:
      enum:
      - MAINTENANCE
      - WEATHER
      - TOURNAMENT
      - EVENT
      - HOLIDAY
      - OTHER
      type: string
      description: |-
        * `MAINTENANCE` - Maintenance
        * `WEATHER` - Weather
        * `TOURNAMENT` - Tournament
        * `EVENT` - Event
        * `HOLIDAY` - Holiday
        * `OTHER` - Other
    UnlinkReport:
      type: object
      description: Booking rules a forced deletion unlinked, and those deactivated
        rather than widened.
      properties:
        unlinked_booking_rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'
        deactivated_booking_rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleRef'
          description: 'Left without any link of a kind they had: deactivated instead
            of covering more.'
      required:
      - deactivated_booking_rules
      - unlinked_booking_rules
    WeekdaysAssignmentRequest:
      type: object
      description: '{"weekdays": ["MONDAY", ..., "FRIDAY"], "day_template": "<id>"
        | null (closed)}'
      properties:
        weekdays:
          type: array
          items:
            $ref: '#/components/schemas/WeekdaysEnum'
        day_template:
          type: string
          format: uuid
          nullable: true
      required:
      - day_template
      - weekdays
    WeekdaysEnum:
      type: string
      enum:
      - MONDAY
      - TUESDAY
      - WEDNESDAY
      - THURSDAY
      - FRIDAY
      - SATURDAY
      - SUNDAY
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
