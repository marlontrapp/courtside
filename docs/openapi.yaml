  /api/v1/me/profile/picture/:
    put:
      operationId: me_profile_picture_update
      description: |2

        Uploads the logged-in player's profile picture (`multipart/form-data`, one
        file field, `picture`) and replaces the previous one; the player profile is
        created if the user has none yet.

        - **Formats:** still **JPEG, PNG or WebP**, detected from the file's
          content (the filename and content type sent are ignored). Animated
          pictures (animated PNG or WebP) and GIF are rejected. Phone photos saved
          as a JPEG with extra images appended (MPO: HDR gain map, depth map, …) are
          accepted; only the photo is kept. Corrupt or truncated files, and images
          above 40 megapixels, are rejected.
        - **Size:** at most the server's `PLAYER_PICTURE_MAX_SIZE_KB` (default
          2048 KB); a clearly larger request is refused
          before its body is read. Downscale camera photos first (512–1024 px is
          plenty for an avatar).
        - **Metadata is removed:** the picture is re-encoded (same format) without
          EXIF — camera, date, **GPS location** —, XMP, IPTC, comments and PNG text;
          the orientation is applied first, so photos stay upright. The colour
          profile and transparency are kept.
        - Each upload gets a new `picture_key` (so CDN caches never serve an old
          picture); `picture_url` is where to fetch it. The previous picture is
          deleted.
      summary: Set my profile picture
      tags:
      - Profile
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PictureUploadRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PictureSaved'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PictureError'
          description: No file / empty file, not an image, unsupported format, animated,
            corrupt, or too many pixels.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not logged in (or, for writes, no CSRF token).
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PictureError'
          description: Larger than the size limit.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: The body isn't multipart/form-data.
    delete:
      operationId: me_profile_picture_destroy
      description: The picture is removed from the profile and deleted from storage;
        the rest of the profile is untouched. `204` also when there's no picture or
        no profile — safe to retry.
      summary: Remove my profile picture
      tags:
      - Profile
      security:
      - cookieAuth: []
      responses:
        '204':
          description: Removed (or there was none).
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not logged in (or, for writes, no CSRF token).
  /api/v1/players/search/:
    get:
      operationId: players_search_list
      description: |2

        Players — **active** users with a player profile — whose name (first / last
        name) or **location** (the profile's free-text location: neighbourhood,
        city, state, country) contains every word of `q`.

        Results show **only public details** — email, phone, birth date and gender
        are neither returned nor searchable. `id` is the player's user id: pass it
        in a booking's `guests` to add the player without knowing their email.
        `picture_url` is `null` without a picture.

        Best matches first: the name starts with the query, then the name contains it, then the name contains every word, then the rest; ties by name. Paginated **without a total count** (counting every match can cost as much as the search itself); a page past the end is empty.
      summary: Find players by name and location
      parameters:
      - name: page
        required: false
        in: query
        description: Page number (25 per page); a page past the end is empty.
        schema:
          type: integer
          minimum: 1
      - in: query
        name: q
        schema:
          type: string
        description: 'Words to find in the player''s name or location: every word
          must appear, whole or partial, ignoring case and accents. Words are runs
          of letters/digits (punctuation separates them); 1-character words are ignored;
          at least one word needs 3+ characters (shorter ones still filter); at most
          8 words and 100 characters. Typos aren''t corrected. Examples: `joao` /
          `JOÃO`, `ana pinheiros`, `lisboa`.'
        required: true
      tags:
      - Players
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlayerSearchResultList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: '`q` missing/blank, too long, too many words, or no word of
            3+ characters: `{"q": ["…"]}`.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not logged in (or, for writes, no CSRF token).
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: '`page` isn''t a positive integer.'
  /api/v1/reservations/:
    get:
      operationId: reservations_list
      description: |2

        The logged-in user's bookings — the ones they booked **and** the ones they're
        a guest in (`role`: `owner` | `guest`). Filters are AND-combined;
        comma-separated values within one are OR-ed; dates/times are wall-clock in
        each club's timezone. `player` takes player ids and/or emails.

        `state` is derived from the stored `status` and the clock, because played
        bookings are never flipped to `COMPLETED` automatically: `upcoming`
        (confirmed, not finished — includes a match in progress), `pending_payment`
        (held, awaiting payment), `completed` (marked completed, or confirmed and
        over), `cancelled`, `expired` (payment hold expired, or its slot passed).

        Each booking includes `can_cancel` (for the requesting user) and
        `cancellation_deadline`, so clients can show the policy before trying.
      summary: My bookings
      parameters:
      - in: query
        name: booking_type
        schema:
          type: array
          items:
            type: string
            enum:
            - BLOCKED
            - DOUBLES
            - LESSON
            - SINGLES
            - TOURNAMENT
        description: |-
          Booking types.

          * `SINGLES` - Singles
          * `DOUBLES` - Doubles
          * `LESSON` - Lesson
          * `TOURNAMENT` - Tournament
          * `BLOCKED` - Blocked
        explode: false
        style: form
      - in: query
        name: club
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Club ids.
        explode: false
        style: form
      - in: query
        name: court
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: Court ids.
        explode: false
        style: form
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: Bookings on that day.
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: On or after this day (inclusive; no range limit).
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: On or before this day (inclusive).
      - in: query
        name: ordering
        schema:
          type: array
          items:
            type: string
            enum:
            - -created
            - -price
            - -start
            - created
            - price
            - start
        description: |-
          Ordering

          * `start` - Start
          * `-start` - Start (descending)
          * `created` - Created
          * `-created` - Created (descending)
          * `price` - Price
          * `-price` - Price (descending)
        explode: false
        style: form
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: player
        schema:
          type: array
          items:
            type: string
        description: Player ids or emails (mixed); booker or guest.
        explode: false
        style: form
      - in: query
        name: role
        schema:
          type: string
          enum:
          - guest
          - owner
        description: |-
          What you are in the booking: the booker (owner) or a guest.

          * `owner` - owner
          * `guest` - guest
      - in: query
        name: state
        schema:
          type: array
          items:
            type: string
            enum:
            - cancelled
            - completed
            - expired
            - pending_payment
            - upcoming
        description: |-
          Lifecycle states, derived from the status and the clock.

          * `upcoming` - Upcoming
          * `pending_payment` - Pending payment
          * `completed` - Completed
          * `cancelled` - Cancelled
          * `expired` - Expired
        explode: false
        style: form
      - in: query
        name: time_from
        schema:
          type: string
          format: time
        description: Starting at or after this time of day (HH:MM, club time).
      - in: query
        name: time_to
        schema:
          type: string
          format: time
        description: Ending at or before this time of day (HH:MM, club time).
      tags:
      - Reservations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReservationList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'Invalid input: `{"<field>": ["message", …]}` (or `non_field_errors`).'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not logged in (or, for writes, no CSRF token).
    post:
      operationId: reservations_create
      description: |2

        Books a court for the logged-in user (the booker). `date`, `start_time` and
        `end_time` are wall-clock in the **club's timezone**; the time must be free
        and match the court's slots — exactly what the courts listing returns as
        `available_slots`. Several consecutive slots can be booked at once (e.g.
        18:00–20:00): it starts when a slot starts, ends when a slot ends, and can't
        span a gap.

        `guests` (optional, max 3) takes each player **by email or by player id**,
        mixed; the same player given twice is one guest. On a **singles court**
        (`is_singles_only`): no doubles, at most 2 players (you and 1 guest).

        The booking must meet the club's **booking rules** (every broken rule is
        listed in the `400`). Payment isn't implemented yet, so bookings are
        `CONFIRMED` immediately.
      summary: Book a court
      tags:
      - Reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
            examples:
              DoublesWithGuests:
                value:
                  court: <court id>
                  date: '2030-01-08'
                  start_time: '18:00'
                  end_time: '19:00'
                  booking_type: DOUBLES
                  includes_lighting: true
                  guests:
                  - friend@example.com
                  - <player id>
                  notes: Bring balls
                summary: Doubles with guests
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonFieldErrors'
          description: 'Invalid input (per field, e.g. `guests`: `Not a player id
            or email: ''…''`, `No registered player with email/id: …`, yourself),
            or not bookable (`non_field_errors`): past, not matching the court''s
            slots — when a one-time override changed that day, the message says why
            (e.g. "… — Tournament: Junior club championship until 14:00.") —, lighting
            unavailable, a singles court with a doubles booking or more than 2 players,
            or broken booking rules. A court you can''t book (e.g. members-only) is
            reported as not existing.'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not logged in (or, for writes, no CSRF token).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonFieldErrors'
          description: The slot is already taken (also when two people book it at
            the same moment).
  /api/v1/reservations/{id}/cancel/:
    post:
      operationId: reservations_cancel_create
      description: |2

        Keeps the booking (status `CANCELLED`, with `cancelled_at` and
        `cancellation_reason`) and frees the slot; the booker and guests are
        notified. Only the booker can cancel — not guests. Policy, per club
        (`cancellation_window_hours`, default 24): a confirmed booking until
        `start − window` (0 = until the start); an unpaid hold any time before the
        start; started, finished, expired or completed bookings never. Repeating the
        call on a booking you already cancelled returns `200` (safe to retry).
      summary: Cancel a booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Reservations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCancelRequest'
            examples:
              Reason:
                value:
                  reason: Rain forecast
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReservationCancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReservationCancelRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Not logged in, or you're a guest in this booking.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: No such booking, or you're not in it.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: Can't be cancelled — the message says why (e.g. the deadline
            passed, with the club's policy).
components:
  schemas:
    AccessTypeEnum:
      enum:
      - OPEN
      - MEMBERS_ONLY
      type: string
      description: |-
        * `OPEN` - Open to all players
        * `MEMBERS_ONLY` - Members only
    Account:
      type: object
      description: The logged-in user's own account — the only place a user's email
        is returned.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        has_password:
          type: boolean
          readOnly: true
          description: False for an account that logs in with codes only (it can set
            one via the password reset).
      required:
      - email
      - first_name
      - has_password
      - id
      - last_name
    ApprovalStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Awaiting approval
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
    BookingRule:
      type: object
      description: |-
        A club's booking rule, for club admins (read and write). Where it applies:
        linked `courts`, `day_templates` (slot configurations) and `slots` (single
        slots of day templates) — ids of this club's; nothing linked = the whole
        club; each kind of link narrows it. `valid_from` / `valid_until`: when
        it's in force. `kind` + `params`: see GET /api/v1/booking-rule-kinds/.
        Expects `context["club"]`.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Shown to players, e.g. "Women's evening".
          maxLength: 100
        kind:
          type: string
          description: What the rule requires — see the booking rule kinds.
          maxLength: 50
        params: {}
        summary:
          type: string
          readOnly: true
        courts:
          type: array
          items:
            type: string
            format: uuid
        day_templates:
          type: array
          items:
            type: string
            format: uuid
        slots:
          type: array
          items:
            type: string
            format: uuid
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          nullable: true
          description: Last day the rule applies (inclusive).
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - name
      - summary
      - updated_at
    BookingRuleInfo:
      type: object
      description: 'A booking rule as players see it: {"id", "name", "kind", "summary"}.'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
        summary:
          type: string
      required:
      - id
      - kind
      - name
      - summary
    BookingRuleKind:
      type: object
      properties:
        kind:
          type: string
        label:
          type: string
        description:
          type: string
        params:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
          description: Param name → its type, required, default, choices, …
      required:
      - description
      - kind
      - label
      - params
    BookingRuleRequest:
      type: object
      description: |-
        A club's booking rule, for club admins (read and write). Where it applies:
        linked `courts`, `day_templates` (slot configurations) and `slots` (single
        slots of day templates) — ids of this club's; nothing linked = the whole
        club; each kind of link narrows it. `valid_from` / `valid_until`: when
        it's in force. `kind` + `params`: see GET /api/v1/booking-rule-kinds/.
        Expects `context["club"]`.
      properties:
        name:
          type: string
          minLength: 1
          description: Shown to players, e.g. "Women's evening".
          maxLength: 100
        kind:
          type: string
          minLength: 1
          description: What the rule requires — see the booking rule kinds.
          maxLength: 50
        params: {}
        courts:
          type: array
          items:
            type: string
            format: uuid
        day_templates:
          type: array
          items:
            type: string
            format: uuid
        slots:
          type: array
          items:
            type: string
            format: uuid
        valid_from:
          type: string
          format: date
          nullable: true
        valid_until:
          type: string
          format: date
          nullable: true
          description: Last day the rule applies (inclusive).
        is_active:
          type: boolean
      required:
      - kind
      - name
    Cancelled:
      type: object
      properties:
        cancelled_reservations:
          type: array
          items:
            $ref: '#/components/schemas/ReservationSummary'
          description: Future bookings cancelled by force (no longer fitting).
      required:
      - cancelled_reservations
    Challenge:
      type: object
      description: A code was emailed (if the email is registered — or, for signups,
        in any case).
      properties:
        challenge_id:
          type: string
          format: uuid
          description: Send it back with the code.
        expires_at:
          type: string
          format: date-time
        detail:
          type: string
      required:
      - challenge_id
      - detail
      - expires_at
    Club:
      type: object
      description: Full club representation (registration response and club detail).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        address:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        access_type:
          allOf:
          - $ref: '#/components/schemas/AccessTypeEnum'
          readOnly: true
          description: |-
            Members-only clubs restrict court visibility and booking to members.

            * `OPEN` - Open to all players
            * `MEMBERS_ONLY` - Members only
        cancellation_window_hours:
          type: integer
          readOnly: true
          description: 'Cancellation policy: players can cancel a confirmed booking
            up to this many hours before it starts. 0 = until the start time.'
        is_active:
          type: boolean
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
          description: |-
            Pending and rejected clubs are hidden from players (search, courts, booking).

            * `PENDING` - Awaiting approval
            * `APPROVED` - Approved
            * `REJECTED` - Rejected
        rejection_reason:
          type: string
          readOnly: true
          description: Why the club wasn't approved (sent to whoever registered it).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - access_type
      - address
      - approval_status
      - cancellation_window_hours
      - created_at
      - id
      - is_active
      - name
      - rejection_reason
      - slug
      - timezone
      - updated_at
    ClubRegistrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
      required:
      - first_name
      - id
      - last_name
    ClubRegistrationRequest:
      type: object
      description: |-
        Input for registering a club: only its name and address. Everything else
        starts at the model defaults and is set later by editing the club; other
        fields in the request body are ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        address:
          type: string
          minLength: 1
      required:
      - address
      - name
    ClubRejectRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          description: Sent to whoever registered the club.
          maxLength: 500
      required:
      - reason
    ClubReview:
      type: object
      description: 'A club as site staff review it: plus who registered it (a player
        summary — no email) and when it was reviewed.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        address:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        access_type:
          allOf:
          - $ref: '#/components/schemas/AccessTypeEnum'
          readOnly: true
          description: |-
            Members-only clubs restrict court visibility and booking to members.

            * `OPEN` - Open to all players
            * `MEMBERS_ONLY` - Members only
        cancellation_window_hours:
          type: integer
          readOnly: true
          description: 'Cancellation policy: players can cancel a confirmed booking
            up to this many hours before it starts. 0 = until the start time.'
        is_active:
          type: boolean
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
          description: |-
            Pending and rejected clubs are hidden from players (search, courts, booking).

            * `PENDING` - Awaiting approval
            * `APPROVED` - Approved
            * `REJECTED` - Rejected
        rejection_reason:
          type: string
          readOnly: true
          description: Why the club wasn't approved (sent to whoever registered it).
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        registered_by:
          allOf:
          - $ref: '#/components/schemas/ClubRegistrant'
          nullable: true
          readOnly: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - access_type
      - address
      - approval_status
      - cancellation_window_hours
      - created_at
      - id
      - is_active
      - name
      - registered_by
      - rejection_reason
      - reviewed_at
      - slug
      - timezone
      - updated_at
    ClubSearchResult:
      type: object
      description: A club in search results (GET /api/v1/clubs/search/).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        address:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        access_type:
          allOf:
          - $ref: '#/components/schemas/AccessTypeEnum'
          readOnly: true
          description: |-
            Members-only clubs restrict court visibility and booking to members.

            * `OPEN` - Open to all players
            * `MEMBERS_ONLY` - Members only
      required:
      - access_type
      - address
      - id
      - name
      - slug
      - timezone
    ClubSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        timezone:
          type: string
          maxLength: 64
        access_type:
          allOf:
          - $ref: '#/components/schemas/AccessTypeEnum'
          description: |-
            Members-only clubs restrict court visibility and booking to members.

            * `OPEN` - Open to all players
            * `MEMBERS_ONLY` - Members only
      required:
      - id
      - name
      - slug
    CodeError:
      type: object
      properties:
        code:
          type: array
          items:
            type: string
      required:
      - code
    CodeRequest:
